name: 'itma'
version: '1.0.0'
config-version: 2

profile: 'itma'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  itma:
    +schema: raw

models:
  itma:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
